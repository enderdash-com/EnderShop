name: Deploy

on:
  - push
  - pull_request

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Build and Deploy

    runs-on: ubuntu-26.04
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Validate Cloudflare artifact
        working-directory: apps/web
        run: bunx cf deploy --prebuilt --dry-run

      - name: Deploy production to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf deploy --prebuilt

      - name: Upload a preview version to Cloudflare
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf workers versions create --prebuilt
