lefthook: bunx --no-install lefthook
min_version: 2.2.2

pre-commit:
  piped: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,scss,md,mdx,yml,yaml,toml}"
      run: bunx --no-install oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Lint from each package so the Tailwind plugin resolves tailwindcss and
    # the shared entry point the same way `bun run lint` does.
    - name: lint web
      root: "apps/web/"
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --no-install oxlint --no-error-on-unmatched-pattern {staged_files}
    - name: lint ui
      root: "packages/ui/"
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --no-install oxlint --no-error-on-unmatched-pattern {staged_files}

pre-push:
  commands:
    types:
      glob: "*.{ts,tsx,json}"
      run: bun run typecheck
    knip:
      run: bun run knip
